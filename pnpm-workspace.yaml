packages:
  - packages/*
  - apps/*
  - tools/*
  - shells/*
  - e2e

# pnpm v10 requires workspace packages to be injected for `pnpm deploy`.
# Without this, deploying a workspace package that depends on other workspace
# packages fails with ERR_PNPM_DEPLOY_NONINJECTED_WORKSPACE. Injection keeps the
# deployed node_modules in the pnpm (`.pnpm`) layout that the OpenDesign image
# hardening patches target.
inject-workspace-packages: true

overrides:
  brace-expansion: 5.0.6
  devalue: 5.8.1
  fast-uri: 3.1.2
  hono: 4.12.19
  ip-address: 10.2.0
  postcss: 8.5.15
  protobufjs: 8.4.0
  qs: 6.15.2
  tmp: 0.2.7
  yaml: 2.9.0

onlyBuiltDependencies:
  - better-sqlite3
  - core-js
  - electron
  - electron-winstaller
  - esbuild
  - onnxruntime-node
  - protobufjs
  - sharp
