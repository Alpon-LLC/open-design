name: Auto Versioning

# ── Template: trunk-based versioning on merge ──
# When a PR to main is merged:
#   1. Allocates a semver tag from the PR title/body (conventional commits)
#      - `feat:` or any `BREAKING CHANGE:` -> major/minor, else patch
#   2. Dispatches container-build.yml for that exact tag and waits for it
#
# Requires a CONCURRENT-safe sequence branch: refs/heads/ci/version-sequence
# (auto-created on first run by this workflow).
# The container build is SKIPPED (build_status=not_triggered) when the repo has
# no image Dockerfile — OpenDesign's lives at deploy/Dockerfile.alpon, so the
# guard checks there. No Slack notify job (OpenDesign has no slack-notification.yml).

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  actions: write

jobs:
  tag-merged-pr:
    name: Tag merged PR
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      latest_tag: ${{ steps.tag.outputs.latest_tag }}
      bump_type: ${{ steps.tag.outputs.bump_type }}
      new_version: ${{ steps.tag.outputs.new_version }}

    steps:
      - name: Checkout main with tags
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Determine version bump
        id: version
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          if grep -qE '^BREAKING CHANGE:' <<< "$PR_TITLE"; then
            BUMP_TYPE="major"
          elif grep -qE '^BREAKING CHANGE:' <<< "$PR_BODY"; then
            BUMP_TYPE="major"
          elif grep -qE '^[a-zA-Z]+(\([^)]*\))?!:' <<< "$PR_TITLE"; then
            BUMP_TYPE="major"
          elif grep -qE '^feat(\([^)]*\))?:' <<< "$PR_TITLE"; then
            BUMP_TYPE="minor"
          else
            BUMP_TYPE="patch"
          fi

          echo "bump_type=$BUMP_TYPE" >> "$GITHUB_OUTPUT"

      - name: Create annotated tag
        id: tag
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          REQUESTED_BUMP: ${{ steps.version.outputs.bump_type }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --tags --force

          if ! git cat-file -e "${MERGE_SHA}^{commit}" 2>/dev/null; then
            echo "Merge commit '$MERGE_SHA' is unavailable" >&2
            exit 1
          fi

          SEQUENCE_REF="refs/heads/ci/version-sequence"
          EMPTY_TREE="$(git mktree < /dev/null)"
          TAG_MESSAGE="$(printf 'PR #%s: %s\n%s\n' "$PR_NUMBER" "$PR_TITLE" "$PR_URL")"
          for ATTEMPT in 1 2 3 4 5; do
            git fetch --tags --force
            if git ls-remote --exit-code --heads origin "$SEQUENCE_REF" >/dev/null 2>&1; then
              git fetch origin "+${SEQUENCE_REF}:${SEQUENCE_REF}"
              SEQUENCE_PARENT="$(git rev-parse "$SEQUENCE_REF")"
              SEQUENCE_COMMIT="$(printf 'Allocate a version for PR #%s\n' "$PR_NUMBER" | git commit-tree "$EMPTY_TREE" -p "$SEQUENCE_PARENT")"
            else
              git update-ref -d "$SEQUENCE_REF"
              SEQUENCE_COMMIT="$(printf 'Initialize version sequence for PR #%s\n' "$PR_NUMBER" | git commit-tree "$EMPTY_TREE")"
            fi

            EXISTING_TAG="$(git tag --points-at "$MERGE_SHA" | grep -E '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -n 1 || true)"
            if [ -n "$EXISTING_TAG" ]; then
              echo "latest_tag=existing"; echo "bump_type=existing"; echo "new_version=$EXISTING_TAG" >> "$GITHUB_OUTPUT"
              echo "Merge commit is already tagged as '$EXISTING_TAG'; reusing it"
              exit 0
            fi

            LATEST_TAG="$(git tag -l | grep -E '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -n 1 || true)"
            if [ -z "$LATEST_TAG" ]; then
              EFFECTIVE_BUMP="initial"; NEW_VERSION="0.0.1"
            else
              EFFECTIVE_BUMP="$REQUESTED_BUMP"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_TAG"
              case "$EFFECTIVE_BUMP" in
                major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
                minor) NEW_VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
                patch) NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
                *) echo "Unknown bump type: $EFFECTIVE_BUMP" >&2; exit 1 ;;
              esac
            fi

            git tag -a "$NEW_VERSION" "$MERGE_SHA" -m "$TAG_MESSAGE"
            if git push --atomic origin "refs/tags/$NEW_VERSION" "$SEQUENCE_COMMIT:$SEQUENCE_REF"; then
              echo "latest_tag=${LATEST_TAG:-none}"; echo "bump_type=$EFFECTIVE_BUMP"; echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git tag -d "$NEW_VERSION"
            echo "Version allocation changed concurrently; recalculating (attempt $ATTEMPT of 5)"
            sleep "$ATTEMPT"
          done

          echo "Could not create a unique version after 5 attempts" >&2
          exit 1

      - name: Version summary
        run: |
          {
            echo "## Version created"
            echo ""
            echo "- Previous tag: \`${{ steps.tag.outputs.latest_tag }}\`"
            echo "- Bump: \`${{ steps.tag.outputs.bump_type }}\`"
            echo "- New tag: \`${{ steps.tag.outputs.new_version }}\`"
            echo "- PR: #${{ github.event.pull_request.number }}"
          } >> "$GITHUB_STEP_SUMMARY"

  build-image:
    name: Build Docker image
    needs: tag-merged-pr
    if: ${{ needs.tag-merged-pr.result == 'success' && needs.tag-merged-pr.outputs.new_version != 'existing' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      build_status: ${{ steps.watch.outputs.build_status }}
      docker_image: ${{ steps.watch.outputs.docker_image }}
      docker_tag: ${{ steps.watch.outputs.docker_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute docker metadata
        id: meta
        env:
          VERSION: ${{ needs.tag-merged-pr.outputs.new_version }}
          IMAGE_NAME: ${{ vars.IMAGE_NAME || format('ghcr.io/{0}', github.repository) }}
        run: |
          IMAGE_NAME="$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          if echo "$VERSION" | grep -qE '^[0-9a-f]{7,40}$'; then
            echo "docker_tag=git-${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "docker_tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi
          echo "docker_image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Dispatch container build and wait
        id: watch
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.tag-merged-pr.outputs.new_version }}
          DOCKER_IMAGE: ${{ steps.meta.outputs.docker_image }}
          DOCKER_TAG: ${{ steps.meta.outputs.docker_tag }}
        run: |
          set -euo pipefail

          # Skip when the repo has no OpenDesign image Dockerfile.
          if [ ! -f deploy/Dockerfile.alpon ]; then
            echo "No deploy/Dockerfile.alpon; skipping container build."
            echo "build_status=not_triggered" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "docker_image=${DOCKER_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "docker_tag=${DOCKER_TAG}" >> "$GITHUB_OUTPUT"

          BEFORE=$(gh run list --workflow=container-build.yml --json=databaseId --jq='.[0].databaseId' 2>/dev/null || echo "none")

          echo "Dispatching container-build.yml for version ${VERSION}..."
          gh workflow run container-build.yml -f version="$VERSION"

          echo "Waiting for workflow run to appear..."
          RUN_ID=""
          for _ in $(seq 1 60); do
            sleep 5
            LATEST=$(gh run list --workflow=container-build.yml --json=databaseId --jq='.[0].databaseId' 2>/dev/null || true)
            if [ -n "$LATEST" ] && [ "$LATEST" != "null" ] && [ "$LATEST" != "$BEFORE" ]; then
              RUN_ID="$LATEST"; break
            fi
          done

          if [ -z "$RUN_ID" ]; then
            echo "::error::Timed out waiting for container workflow to start"
            echo "build_status=not_found" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "Watching run ${RUN_ID}..."
          gh run watch "$RUN_ID"
          CONCLUSION=$(gh run view "$RUN_ID" --json=conclusion --jq='.conclusion')
          echo "build_status=${CONCLUSION}" >> "$GITHUB_OUTPUT"

  notify-slack:
    name: Notify Slack
    needs: [tag-merged-pr, build-image]
    if: ${{ always() && github.event.pull_request.merged == true }}
    uses: ./.github/workflows/slack-notification.yml
    with:
      status: ${{ needs.tag-merged-pr.result == 'success' && 'success' || 'failure' }}
      repository_url: ${{ format('{0}/{1}', github.server_url, github.repository) }}
      version_url: ${{ needs.tag-merged-pr.result == 'success' && format('{0}/{1}/tree/{2}', github.server_url, github.repository, needs.tag-merged-pr.outputs.new_version) || '' }}
      changelog_url: ${{ needs.tag-merged-pr.result == 'success' && needs.tag-merged-pr.outputs.latest_tag != 'none' && needs.tag-merged-pr.outputs.latest_tag != 'existing' && format('{0}/{1}/compare/{2}...{3}', github.server_url, github.repository, needs.tag-merged-pr.outputs.latest_tag, needs.tag-merged-pr.outputs.new_version) || '' }}
      workflow_url: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
      pr_title: ${{ github.event.pull_request.title }}
      pr_author: ${{ github.event.pull_request.user.login }}
      pr_url: ${{ github.event.pull_request.html_url }}
      tag: ${{ needs.tag-merged-pr.outputs.new_version }}
      previous_tag: ${{ needs.tag-merged-pr.outputs.latest_tag }}
      bump_type: ${{ needs.tag-merged-pr.outputs.bump_type }}
      build_status: ${{ needs.build-image.outputs.build_status || 'not_triggered' }}
      docker_image: ${{ needs.build-image.outputs.docker_image || '' }}
      docker_tag: ${{ needs.build-image.outputs.docker_tag || '' }}
    secrets:
      slack_bot_token: ${{ secrets.ALPON_WATCHDOG_SLACK_BOT_TOKEN }}
      slack_channel_id: ${{ secrets.SLACK_CHANNEL_ID }}
      project_slug: ${{ secrets.PROJECT_SLUG }}
